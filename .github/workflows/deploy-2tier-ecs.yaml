# docker build -and tag with ecr 
# ecr login -> docker push
# update ecs task definition with new image and prompote a new deployment

name: Deploy 2 Tier ECS

on:
  # push:
  #   branches:
  #     - main

  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REPO_NAME: dev-tf2t
  AWS_ACCOUNT_ID: 879381241087


  # ECR_REPO_URI: ${{ secrets.ECR_REPO_URI }}
  # ECS_CLUSTER_NAME: 2tier-ecs-cluster
  # ECS_SERVICE_NAME: 2tier-ecs-service
  # ECS_TASK_DEFINITION_NAME: 2tier-ecs-task-definition
  # ECS_TASK_DEFINITION_FAMILY: 2tier-ecs-task-definition-family
  # ECS_TASK_DEFINITION_VERSION: 1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Set up AWS CLI
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com

      - name: Build and push Docker image
        run: |
          docker build -t ${{ env.ECR_REPO_NAME }}:latest .
          docker tag ${{ env.ECR_REPO_NAME }}:latest ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPO_NAME }}:latest
          docker push ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPO_NAME }}:latest

    