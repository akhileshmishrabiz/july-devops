services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: dbPassword
      POSTGRES_USER: db_user
      POSTGRES_DB: db_name
    volumes:
      - db_data:/var/lib/postgresql/data

    networks:
      - app_network
    ports:
      - 5432:5432

    healthcheck:
      test: ["CMD", "pg_isready", "-U", "db_user"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 20s

  app:
    # image: app:3.0
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DB_LINK: postgresql://db_user:dbPassword@postgres:5432/db_name
    networks:
      - app_network
    ports:
      - 8000:8000

    depends_on:
      - postgres:
          condition: service_healthy

volumes:
  db_data:

networks:
  app_network:
    driver: bridge  