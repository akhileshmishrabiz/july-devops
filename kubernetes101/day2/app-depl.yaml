apiVersion: apps/v1
kind: Deployment
metadata:
  name: 2tierapp
  labels:
    app: app
spec:
  replicas: 4
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      containers:
      - name: app
        image: appwithdb:1.0
        ports:
        - containerPort: 8080
        env:
          - name: DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: postgres-secret
                key: DB_URL
---
apiVersion: v1
kind: Service
metadata:
  name: app-service
spec:
  selector:
    app: app
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080
---
# db url secret
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
type: Opaque
stringData:
  # DB_URL: postgresql://postgres:Admin1234@10.96.66.160:5432/postgres
  DB_URL: postgresql://postgres:Admin1234@postgres-service.default.svc.cluster.local:5432/postgres
---