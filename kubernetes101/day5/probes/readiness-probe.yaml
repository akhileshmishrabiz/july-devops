# Simulate readiness failure:
#   kubectl port-forward -n probe-demo deployment/readiness-demo 8081:8080
#   curl http://localhost:8081/control/not-ready
#
# The container keeps running, but the pod becomes 0/1 Ready and is removed
# from the Service endpoints. Restore readiness with:
#   curl http://localhost:8081/control/ready
#
# Observe:
#   kubectl get pods,endpoints -n probe-demo -w
#   kubectl logs -n probe-demo deployment/readiness-demo -f
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: readiness-demo-code
  namespace: probe-demo
data:
  app.py: |
    import threading
    import time
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    state = {"ready": True}
    state_lock = threading.Lock()


    def log(message):
        print(
            f"{time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime())} {message}",
            flush=True,
        )


    class Handler(BaseHTTPRequestHandler):
        def reply(self, status, text):
            body = text.encode()
            self.send_response(status)
            self.send_header("Content-Type", "text/plain")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def do_GET(self):
            if self.path == "/ready":
                with state_lock:
                    ready = state["ready"]
                self.reply(200 if ready else 503, "ready\n" if ready else "not ready\n")
                return

            if self.path == "/control/not-ready":
                with state_lock:
                    state["ready"] = False
                log("event=readiness_disabled")
                self.reply(200, "readiness will now fail\n")
                return

            if self.path == "/control/ready":
                with state_lock:
                    state["ready"] = True
                log("event=readiness_enabled")
                self.reply(200, "readiness will now pass\n")
                return

            self.reply(
                200,
                "Use /control/not-ready to fail readiness and "
                "/control/ready to restore it\n",
            )

        def log_message(self, *_):
            return


    log("event=server_started port=8080 readiness=true")
    ThreadingHTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: readiness-demo
  namespace: probe-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: readiness-demo
  template:
    metadata:
      labels:
        app: readiness-demo
    spec:
      containers:
        - name: app
          image: python:3.13-alpine
          command: ["python", "-u", "/app/app.py"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 2
            successThreshold: 1
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: app-code
              mountPath: /app
              readOnly: true
      volumes:
        - name: app-code
          configMap:
            name: readiness-demo-code
---
apiVersion: v1
kind: Service
metadata:
  name: readiness-demo
  namespace: probe-demo
spec:
  selector:
    app: readiness-demo
  ports:
    - name: http
      port: 80
      targetPort: http
