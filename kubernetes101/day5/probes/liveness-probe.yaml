# Simulate liveness failure:
#   kubectl port-forward -n probe-demo deployment/liveness-demo 8082:8080
#   curl http://localhost:8082/control/fail
#
# The liveness probe fails 3 times, then Kubernetes restarts the container.
# The port-forward may disconnect when the container restarts.
#
# Observe the restart and inspect logs:
#   kubectl get pods -n probe-demo -w
#   kubectl describe pod -n probe-demo -l app=liveness-demo
#   kubectl logs -n probe-demo deployment/liveness-demo --previous
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: liveness-demo-code
  namespace: probe-demo
data:
  app.py: |
    import threading
    import time
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    state = {"live": True}
    state_lock = threading.Lock()


    def log(message):
        print(
            f"{time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime())} {message}",
            flush=True,
        )


    class Handler(BaseHTTPRequestHandler):
        def reply(self, status, text):
            body = text.encode()
            self.send_response(status)
            self.send_header("Content-Type", "text/plain")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def do_GET(self):
            if self.path == "/live":
                with state_lock:
                    live = state["live"]
                self.reply(200 if live else 500, "alive\n" if live else "unhealthy\n")
                return

            if self.path == "/control/fail":
                with state_lock:
                    state["live"] = False
                log("event=liveness_disabled waiting_for_kubelet_restart")
                self.reply(200, "liveness will now fail\n")
                return

            self.reply(200, "Use /control/fail to trigger a liveness restart\n")

        def log_message(self, *_):
            return


    log("event=server_started port=8080 liveness=true")
    ThreadingHTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: liveness-demo
  namespace: probe-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: liveness-demo
  template:
    metadata:
      labels:
        app: liveness-demo
    spec:
      containers:
        - name: app
          image: python:3.13-alpine
          command: ["python", "-u", "/app/app.py"]
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /live
              port: http
            periodSeconds: 3
            timeoutSeconds: 1
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: app-code
              mountPath: /app
              readOnly: true
      volumes:
        - name: app-code
          configMap:
            name: liveness-demo-code
---
apiVersion: v1
kind: Service
metadata:
  name: liveness-demo
  namespace: probe-demo
spec:
  selector:
    app: liveness-demo
  ports:
    - name: http
      port: 80
      targetPort: http
