apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres
  namespace: default
spec:
  refreshInterval: 15s
  secretStoreRef:
    kind: SecretStore
    name: vault
  target:
    name: postgres-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      data:
        POSTGRES_USER: "{{ .username }}"
        POSTGRES_PASSWORD: "{{ .password }}"
        POSTGRES_DB: "{{ .database }}"
        DB_URL: "postgresql://{{ .username }}:{{ .password }}@postgres-service.default.svc.cluster.local:5432/{{ .database }}"
  data:
    - secretKey: username
      remoteRef:
        key: day3-part2/postgres
        property: username
    - secretKey: password
      remoteRef:
        key: day3-part2/postgres
        property: password
    - secretKey: database
      remoteRef:
        key: day3-part2/postgres
        property: database
    - secretKey: test
      remoteRef:
        key: data/name/test
        property: test