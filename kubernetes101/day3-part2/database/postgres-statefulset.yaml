apiVersion: v1
kind: Service
metadata:
  name: postgres-service
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres-service
  replicas: 2
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_PASSWORD_FILE
              value: /etc/postgres-secret/POSTGRES_PASSWORD
            - name: POSTGRES_USER_FILE
              value: /etc/postgres-secret/POSTGRES_USER
            - name: POSTGRES_DB_FILE
              value: /etc/postgres-secret/POSTGRES_DB
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command:
                - sh
                - -ec
                - pg_isready -U "$(cat /etc/postgres-secret/POSTGRES_USER)" -d "$(cat /etc/postgres-secret/POSTGRES_DB)"
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: postgres-secret
              mountPath: /etc/postgres-secret
              readOnly: true
      volumes:
        - name: postgres-secret
          secret:
            secretName: postgres-secret
            items:
              - key: POSTGRES_PASSWORD
                path: POSTGRES_PASSWORD
              - key: POSTGRES_USER
                path: POSTGRES_USER
              - key: POSTGRES_DB
                path: POSTGRES_DB
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: standard
        resources:
          requests:
            storage: 5Gi
