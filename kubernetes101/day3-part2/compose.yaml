services:
  app:
    build:
      context: ./app
    image: appwithdb:1.0
    ports:
      - "8080:8080"
    environment:
      SECRET_DIR: /run/secrets
      CONFIG_DIR: /etc/app-config
    secrets:
      - DB_URL
    configs:
      - source: APP_TITLE
        target: /etc/app-config/APP_TITLE
      - source: ENVIRONMENT
        target: /etc/app-config/ENVIRONMENT
      - source: LAB_TITLE
        target: /etc/app-config/LAB_TITLE
      - source: LAB_PROMPT
        target: /etc/app-config/LAB_PROMPT
      - source: LAB_HINT
        target: /etc/app-config/LAB_HINT
      - source: LAB_ANSWER
        target: /etc/app-config/LAB_ANSWER
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:15
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/POSTGRES_PASSWORD
      POSTGRES_USER_FILE: /run/secrets/POSTGRES_USER
      POSTGRES_DB_FILE: /run/secrets/POSTGRES_DB
      PGDATA: /var/lib/postgresql/data/pgdata
    secrets:
      - POSTGRES_PASSWORD
      - POSTGRES_USER
      - POSTGRES_DB
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$(cat /run/secrets/POSTGRES_USER)\" -d \"$$(cat /run/secrets/POSTGRES_DB)\""]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:

secrets:
  DB_URL:
    file: ./secrets/DB_URL
  POSTGRES_PASSWORD:
    file: ./secrets/POSTGRES_PASSWORD
  POSTGRES_USER:
    file: ./secrets/POSTGRES_USER
  POSTGRES_DB:
    file: ./secrets/POSTGRES_DB

configs:
  APP_TITLE:
    file: ./config/APP_TITLE
  ENVIRONMENT:
    file: ./config/ENVIRONMENT
  LAB_TITLE:
    file: ./config/LAB_TITLE
  LAB_PROMPT:
    file: ./config/LAB_PROMPT
  LAB_HINT:
    file: ./config/LAB_HINT
  LAB_ANSWER:
    file: ./config/LAB_ANSWER
