
apiVersion: v1
kind: Pod
metadata:
  name: multi-container-pod
spec:
  containers:
    - name: nginx
      image: nginx:latest
      ports:
        - containerPort: 80

    - name: busybox
      image: busybox:latest
      command: ["sh", "-c", "while true; do sleep 3600; done"]

    - name: alpine
      image: alpine:latest
      command: ["sh", "-c", "echo 'Hello from Alpine' && sleep 3600"]
