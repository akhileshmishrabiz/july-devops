apiVersion: apps/v1
kind: Deployment
metadata:
  name: hpa-load
  namespace: scaling
spec:
  replicas: 0
  selector:
    matchLabels:
      app: hpa-load
  template:
    metadata:
      labels:
        app: hpa-load
    spec:
      containers:
        - name: load
          image: busybox:1.36
          command:
            - sh
            - -ec
            - |
              while true
              do
                wget -q -O- http://hpa-app/work >/dev/null
              done
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 100m
              memory: 32Mi
---
