apiVersion: v1
kind: ConfigMap
metadata:
  name: load-app
  namespace: scaling
data:
  app.py: |
    import hashlib
    import os
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    APP_NAME = os.getenv("APP_NAME", "scaling-app")


    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path == "/healthz":
                body = b"ok\n"
            elif self.path == "/work":
                value = b"kubernetes-autoscaling"
                for _ in range(180_000):
                    value = hashlib.sha256(value).digest()
                temporary_memory = bytearray(2 * 1024 * 1024)
                temporary_memory[0] = 1
                body = f"{APP_NAME}: work complete\n".encode()
            else:
                body = f"{APP_NAME}: use /work to generate load\n".encode()

            self.send_response(200)
            self.send_header("Content-Type", "text/plain")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def log_message(self, *_):
            return


    ThreadingHTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hpa-app
  namespace: scaling
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hpa-app
  template:
    metadata:
      labels:
        app: hpa-app
    spec:
      containers:
        - name: app
          image: python:3.13-alpine
          command: ["python", "/app/app.py"]
          env:
            - name: APP_NAME
              value: hpa-app
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 300m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          volumeMounts:
            - name: app-code
              mountPath: /app
              readOnly: true
      volumes:
        - name: app-code
          configMap:
            name: load-app
---
apiVersion: v1
kind: Service
metadata:
  name: hpa-app
  namespace: scaling
spec:
  selector:
    app: hpa-app
  ports:
    - name: http
      port: 80
      targetPort: http
---
