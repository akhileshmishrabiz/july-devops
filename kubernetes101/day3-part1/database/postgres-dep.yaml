apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_PASSWORD_FILE
              value: /etc/postgres-secret/POSTGRES_PASSWORD
            - name: POSTGRES_USER_FILE
              value: /etc/postgres-secret/POSTGRES_USER
            - name: POSTGRES_DB_FILE
              value: /etc/postgres-secret/POSTGRES_DB
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: postgres-secret
              mountPath: /etc/postgres-secret
              readOnly: true
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-pvc
        - name: postgres-secret
          secret:
            secretName: postgres-secret
            items:
              - key: POSTGRES_PASSWORD
                path: POSTGRES_PASSWORD
              - key: POSTGRES_USER
                path: POSTGRES_USER
              - key: POSTGRES_DB
                path: POSTGRES_DB

---
# service 
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
spec:
  selector:
    app: postgres
  ports:
  - protocol: TCP
    port: 5432
    targetPort: 5432